name: Deploy frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 's1ash-cmd/gutv_booker_ui' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, gutv-frontend]
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Build and deploy on server
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/local/bin:/usr/bin:/bin
          exec 9>/opt/gutv/src/.deploy.lock
          flock -w 1800 9
          cd /opt/gutv/src/gutv_booker_ui
          test "$(git branch --show-current)" = master
          sudo -n -l /usr/bin/systemctl restart gutv-ui.service >/dev/null
          git pull --ff-only origin master
          test -s .env.production
          npm ci
          npm run build
          rsync -a --delete .next package.json package-lock.json public next.config.ts /opt/gutv/ui/
          cp .env.production /opt/gutv/ui/.env.production
          cd /opt/gutv/ui
          npm ci --omit=dev --ignore-scripts
          sudo -n systemctl restart gutv-ui.service
          sleep 3
          systemctl is-active --quiet gutv-ui.service
